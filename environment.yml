name: mmd-tfs
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.*
  - pandas=2.1.*
  - scikit-learn
  - scipy
  - matplotlib
  - tqdm
  - pip:
      # RTX 5090 (sm_120) needs cu132; install with:
      # pip install torch==2.13.0 torchvision --index-url https://download.pytorch.org/whl/cu132
      - torch==2.13.0
      - torchvision
      - transformers>=4.40,<5
      - peft>=0.11
      - openai>=1.0
      - PyYAML
      - accelerate
      - einops
      - statsmodels
      - gensim
      - reformer-pytorch
      - arch
